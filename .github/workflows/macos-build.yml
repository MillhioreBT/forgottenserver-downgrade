name: Build (macOS)

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/macos-build.yml
      - CMakeLists.txt
      - cmake/**
      - src/**
      - vcpkg.json

  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/macos-build.yml
      - CMakeLists.txt
      - cmake/**
      - src/**
      - vcpkg.json

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same vcpkg as the Dockerfile (VCPKG_VERSION); the dependency versions come from the builtin-baseline in vcpkg.json.
  VCPKG_VERSION: 2026.10.16
  # Also read by CMakeLists.txt to pick the triplet.
  VCPKG_DEFAULT_TRIPLET: arm64-osx
  # vcpkg binary cache: each built port is stored as a zip, so a cache restored from an older key only rebuilds
  # the ports whose ABI changed (new vcpkg.json, new vcpkg, new Xcode in the runner image).
  VCPKG_CACHE_DIR: ${{ github.workspace }}/vcpkg-binary-cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite

jobs:
  build:
    # Pinned: Apple Silicon (arm64), with the Xcode/AppleClang of the image. Bump it on purpose.
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Set up vcpkg
        id: vcpkg
        run: |
          git clone --branch "$VCPKG_VERSION" https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_CACHE_DIR"
          echo "root=$RUNNER_TEMP/vcpkg" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ steps.vcpkg.outputs.image }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ steps.vcpkg.outputs.image }}-
            vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Install dependencies (vcpkg)
        env:
          VCPKG: ${{ steps.vcpkg.outputs.root }}/vcpkg
        run: |
          # a network error while downloading a port must not fail the build: retry, already built ports come back
          # from the binary cache
          for attempt in 1 2 3; do
            "$VCPKG" install --triplet "$VCPKG_DEFAULT_TRIPLET" --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" && exit 0
            echo "vcpkg install failed (attempt $attempt/3), retrying in 30s..."
            sleep 30
          done
          exit 1

      # Only the archives of the ports installed now are kept, so the cache does not grow with every image update.
      - name: Prune vcpkg binary cache
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        run: |
          status="$GITHUB_WORKSPACE/vcpkg_installed/vcpkg/status"
          if [ ! -f "$status" ]; then echo "No vcpkg status file, nothing pruned"; exit 0; fi
          sed -n 's/^Abi: //p' "$status" | sort -u > "$RUNNER_TEMP/used-abis"
          removed=0
          while IFS= read -r archive; do
            if ! grep -qxF "$(basename "$archive" .zip)" "$RUNNER_TEMP/used-abis"; then
              rm -f -- "$archive"
              removed=$((removed + 1))
            fi
          done < <(find "$VCPKG_CACHE_DIR" -name '*.zip')
          echo "$(wc -l < "$RUNNER_TEMP/used-abis" | tr -d ' ') ports in use, removed $removed stale archives"

      # Saved from main only: pull requests restore it, and a cache saved from a pull request is only usable by it.
      - name: Save vcpkg binary cache
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build (Release)
        run: |
          # VCPKG_INSTALLED_DIR points at the dependencies installed above; without it the vcpkg toolchain installs
          # them again in build/vcpkg_installed
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.root }}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"
          test -x build/tfs
          echo "Built build/tfs ($(du -h build/tfs | cut -f1))"
