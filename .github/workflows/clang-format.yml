name: Check code style

on:
  push:
    branches:
      - main
      - v*

    paths:
      - .clang-format
      - .github/workflows/clang-format.yml
      - src/**
      - tests/**

  pull_request:
    paths:
      - .clang-format
      - .github/workflows/clang-format.yml
      - src/**
      - tests/**

  workflow_dispatch:

env:
  # Pinned: the formatting rules change between major versions (23 already reports violations on main), so a
  # floating version breaks the check without any change to the code. Bump it on purpose, together with a reformat.
  CLANG_FORMAT_VERSION: "22.1.8"

jobs:
  check-format:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          pipx install "clang-format==${CLANG_FORMAT_VERSION}"
          # the runner image ships its own clang-format in /usr/bin; put the pinned one first in PATH
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"

      - name: Check code style
        run: |
          clang-format --version
          clang-format --version | grep -qF "version ${CLANG_FORMAT_VERSION}"
          git ls-files -z 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' | xargs -0 clang-format -n -style=file --Werror
