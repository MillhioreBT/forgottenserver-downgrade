name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/tests.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - schema.sql
      - src/**
      - tests/**
      - vcpkg.json

  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/tests.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - schema.sql
      - src/**
      - tests/**
      - vcpkg.json

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  tests:
    name: Unit and integration tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: forgottenserver
          MARIADB_USER: forgottenserver
          MARIADB_PASSWORD: forgottenserver
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ninja-build ccache \
            libboost-system-dev libboost-iostreams-dev libboost-locale-dev libboost-json-dev libboost-test-dev \
            libfmt-dev libmariadb-dev libmariadb-dev-compat libpugixml-dev liblua5.4-dev libssl-dev zlib1g-dev

      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tests-${{ github.sha }}
          restore-keys: ccache-tests-

      - name: Build
        run: |
          ccache --zero-stats
          cmake --preset test -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset test
          ccache --show-stats

      - name: Save compiler cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Load the database schema
        run: docker exec -i "${{ job.services.mariadb.id }}" mariadb -uroot -proot forgottenserver < schema.sql

      - name: Run tests
        env:
          TFS_TEST_MYSQL_HOST: 127.0.0.1
          TFS_TEST_MYSQL_PORT: 3306
          TFS_TEST_MYSQL_USER: forgottenserver
          TFS_TEST_MYSQL_PASSWORD: forgottenserver
          TFS_TEST_MYSQL_DATABASE: forgottenserver
        run: ctest --preset test --output-junit "$RUNNER_TEMP/tests.xml"

      - name: Summary
        if: success() || failure()
        run: |
          python3 - "$RUNNER_TEMP/tests.xml" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import re
          import sys
          import xml.etree.ElementTree as ET

          try:
              cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          except (OSError, ET.ParseError):
              print("## Tests\n\nThe tests did not run: see the job log.")
              sys.exit(0)

          def count(output, outcome):
              match = re.search(rf"(\d+) test cases? out of (\d+) {outcome}", output)
              return (int(match.group(1)), int(match.group(2))) if match else (0, 0)

          def label(case):
              for prop in case.iter("property"):
                  if prop.get("name") == "cmake_labels":
                      return prop.get("value")
              return ""

          rows, failures = [], []
          for case in cases:
              output = case.findtext("system-out") or ""
              passed_cases, total = count(output, "passed")
              skipped_cases, _ = count(output, "skipped")
              if case.get("status") == "notrun":
                  icon, cases_column = "⏭️", "skipped"
              elif case.find("failure") is None:
                  icon, cases_column = "✅", f"{passed_cases}/{total - skipped_cases}"
              else:
                  icon, cases_column = "❌", f"{passed_cases}/{total - skipped_cases}"
                  failures.append(f"<details open><summary><code>{case.get('name')}</code></summary>\n\n"
                                  f"```\n{output.strip()}\n```\n</details>")
              rows.append(f"| {icon} | `{case.get('name')}` | {label(case)} | {cases_column} | "
                          f"{float(case.get('time', 0)):.2f}s |")

          print("## Tests\n")
          print("| | Suite | Kind | Test cases passed | Time |\n|---|---|---|---|---|")
          print("\n".join(rows))
          if failures:
              print("\n### Failures\n")
              print("\n\n".join(failures))
          EOF
