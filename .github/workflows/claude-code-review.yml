name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Decide si Claude responde a este comentario y qué puede hacer. Solo llegan aquí los comentarios del owner.
  # Claude responde si el comentario menciona @claude, o si responde a Claude: el comentario anterior en el mismo
  # hilo de review o en la conversación del issue/PR es de claude[bot].
  gate:
    if: github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      build: ${{ steps.decide.outputs.build }}
      fork: ${{ steps.decide.outputs.fork }}
      is_pr: ${{ steps.decide.outputs.is_pr }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) && 'true' || 'false' }}
          AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPLY_TO: ${{ github.event.comment.in_reply_to_id }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Autor del comentario justo anterior a este en el mismo hilo de review o en la conversación
          previous_author() {
            if [ "$EVENT" = pull_request_review_comment ]; then
              gh api --paginate "repos/$REPO/pulls/$NUMBER/comments?per_page=100" \
                --jq ".[] | select((.id == $REPLY_TO or .in_reply_to_id == $REPLY_TO) and .id < $COMMENT_ID) | [.id, .user.login] | @tsv"
            else
              gh api --paginate "repos/$REPO/issues/$NUMBER/comments?per_page=100" \
                --jq ".[] | select(.id < $COMMENT_ID) | [.id, .user.login] | @tsv"
            fi | sort -n -k1,1 | tail -n 1 | cut -f 2
          }

          run=false
          if grep -qiE '(^|[[:space:]])@claude([[:space:].,!?;:]|$)' <<< "$BODY"; then
            run=true
            echo "The comment mentions @claude."
          elif grep -qF 'Generated by [Claude Code]' <<< "$BODY"; then
            # Comentario de una sesión de Claude Code publicado con la cuenta del owner, no una respuesta suya
            echo "Posted by a Claude Code session, not a reply to Claude."
          elif [ "$EVENT" = pull_request_review_comment ] && [ -z "$REPLY_TO" ]; then
            echo "New review thread without @claude."
          else
            prev=$(previous_author)
            if [ "$prev" = 'claude[bot]' ]; then
              run=true
              echo "The comment replies to Claude."
            else
              echo "No @claude and the previous comment is not Claude's (it is by ${prev:-nobody})."
            fi
          fi

          # Compilar ejecuta el código del checkout en un runner con el token de la App de Claude (escritura en el
          # repo) y CLAUDE_CODE_OAUTH_TOKEN: solo cuando todo lo que Claude lee es del owner. Los comentarios y
          # reviews de otros ya los filtra include_comments_by_actor; queda el autor del issue/PR y el código.
          build=false
          fork=false
          if [ "$run" = true ]; then
            head_repo=""
            if [ "$IS_PR" = true ]; then
              head_repo=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.repo.full_name // ""')
              [ "$head_repo" = "$REPO" ] || fork=true
            fi
            if [ "$AUTHOR" != "$OWNER" ]; then
              echo "Build disabled: opened by $AUTHOR."
            elif [ "$fork" = true ]; then
              echo "Build disabled: the pull request comes from ${head_repo:-a deleted fork}."
            else
              build=true
              echo "Build enabled."
            fi
          fi

          {
            echo "run=$run"
            echo "build=$build"
            echo "fork=$fork"
            echo "is_pr=$IS_PR"
          } >> "$GITHUB_OUTPUT"

  claude:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Una ejecución a la vez por issue/PR: una respuesta nueva espera a que termine la actual
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # leer el estado y los logs del CI del PR

    steps:
      # En segundo plano, mientras Claude arranca; el script de build espera a que termine
      - name: Install build dependencies
        if: needs.gate.outputs.build == 'true'
        run: |
          nohup bash -c 'sudo apt-get update -qq \
            && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ninja-build \
              libboost-system-dev libboost-iostreams-dev libboost-locale-dev libboost-json-dev libfmt-dev \
              libmariadb-dev libmariadb-dev-compat libpugixml-dev liblua5.4-dev libssl-dev zlib1g-dev \
            && touch "$RUNNER_TEMP/build-deps.ok"' > "$RUNNER_TEMP/build-deps.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/build-deps.pid"

      # Fuera del workspace: Claude solo puede ejecutarlo, no editarlo
      - name: Write the build script
        if: needs.gate.outputs.build == 'true'
        run: |
          {
            echo '#!/usr/bin/env bash'
            printf 'TEMP_DIR=%q\nSRC_DIR=%q\n' "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            cat <<'EOF'
          # Builds the server from the checked-out code with CMake and Ninja. Takes no arguments.
          set -uo pipefail
          while kill -0 "$(cat "$TEMP_DIR/build-deps.pid")" 2>/dev/null; do sleep 2; done
          if [ ! -f "$TEMP_DIR/build-deps.ok" ]; then
            echo "BUILD NOT RUN: installing the build dependencies failed:"
            tail -n 30 "$TEMP_DIR/build-deps.log"
            exit 2
          fi
          build_dir="$TEMP_DIR/tfs-build"
          if ! cmake -S "$SRC_DIR" -B "$build_dir" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              > "$TEMP_DIR/cmake-configure.log" 2>&1; then
            echo "BUILD FAILED: CMake configure step:"
            tail -n 60 "$TEMP_DIR/cmake-configure.log"
            exit 1
          fi
          # --quiet: only warnings and errors; -k 0: keep going to report every file that fails
          cmake --build "$build_dir" -- --quiet -k 0 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then echo "BUILD OK"; else echo "BUILD FAILED (exit $status)"; fi
          exit "$status"
          EOF
          } > "$RUNNER_TEMP/build-tfs.sh"
          chmod +x "$RUNNER_TEMP/build-tfs.sh"

      - name: Configure Claude
        id: config
        env:
          BUILD: ${{ needs.gate.outputs.build }}
          FORK: ${{ needs.gate.outputs.fork }}
          IS_PR: ${{ needs.gate.outputs.is_pr }}
        run: |
          set -euo pipefail
          build_script="$RUNNER_TEMP/build-tfs.sh"
          allowed="mcp__github_inline_comment__create_inline_comment"
          [ "$BUILD" = true ] && allowed="$allowed,Bash($build_script:*)"
          args="--allowedTools \"$allowed\""
          # En un PR de un fork Claude no puede pushear a la rama del contribuidor: sin commits, solo sugerencias
          [ "$FORK" = true ] && args="$args --disallowedTools \"Bash(git add:*),Bash(git commit:*),Bash(git rm:*)\""
          echo "claude_args=$args" >> "$GITHUB_OUTPUT"

          {
            echo 'prompt<<CLAUDE_PROMPT_EOF'
            echo 'Always write in US English: every reply, review, inline comment, code suggestion, and commit message, even when the request is written in another language.'
            echo 'The comment in <trigger_comment> holds the request even when it does not contain @claude: a reply to one of your comments also triggers you.'
            if [ "$FORK" = true ]; then
              echo 'This pull request comes from a fork, so you cannot push to it and committing is disabled. Propose each code change as an inline review comment on the changed lines with a GitHub suggestion block (```suggestion), so it can be applied with "Commit suggestion". Show changes to lines outside the diff in your reply.'
            elif [ "$IS_PR" = true ]; then
              echo 'For small, local fixes you can leave inline review comments with GitHub suggestion blocks (```suggestion) on the changed lines. When asked to make changes, commit and push them to the pull request branch.'
            fi
            if [ "$BUILD" = true ]; then
              echo "To verify C++ changes, build the server by running \`$build_script\` with no arguments and a timeout of 900000 ms. It waits for the build dependencies, then configures and builds with CMake and Ninja (the first build takes 3 to 5 minutes, later ones are incremental), prints only warnings and errors, and ends with BUILD OK or BUILD FAILED. Build before you commit C++ changes, and say in your reply whether the build passed."
            else
              echo 'Building is not available in this run. Do not claim that the code compiles; if the pull request has CI runs, you can read their status and logs.'
            fi
            echo 'CLAUDE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        env:
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "1200000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Solo incluir en el contexto los comentarios y reviews del owner y las respuestas previas de Claude
          # (reduce superficie de prompt injection sin perder el hilo de la conversación)
          include_comments_by_actor: ${{ github.repository_owner }},claude[bot]
          # Con prompt + track_progress la action no exige @claude en el comentario (modo tag igualmente);
          # quién y cuándo dispara a Claude lo decide el job gate
          track_progress: true
          prompt: ${{ steps.config.outputs.prompt }}
          claude_args: ${{ steps.config.outputs.claude_args }}
