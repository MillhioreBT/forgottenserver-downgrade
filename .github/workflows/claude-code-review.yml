name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    # Solo corre si el comentario lo hace el OWNER del repo y menciona @claude
    # (issue_comment cubre issues y la conversación de PRs; pull_request_review_comment cubre comentarios inline)
    if: |
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '@claude')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Solo incluir en el contexto los comentarios del owner y las respuestas previas de Claude
          # (reduce superficie de prompt injection sin perder el hilo de la conversación)
          include_comments_by_actor: ${{ github.repository_owner }},claude[bot]
